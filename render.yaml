services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: quizforge-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quizforge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: BACKEND_CORS_ORIGINS
        fromService:
          type: web
          name: quizforge-client
          property: host

  # 2. Frontend Static Site (React Vite)
  - type: web
    name: quizforge-client
    env: static
    rootDir: frontend
    buildCommand: export VITE_API_URL=$VITE_API_URL/api/v1 && npm install && npm run build
    publishDir: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: quizforge-api
          property: host

databases:
  - name: quizforge-db
    plan: free

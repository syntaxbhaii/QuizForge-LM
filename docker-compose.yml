version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quizforge-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quizforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quizforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: quizforge-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/quizforge
      - SECRET_KEY=quizforge_super_secret_jwt_key_for_docker_testing
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - FIRST_SUPERUSER_EMAIL=admin@quizforge.com
      - FIRST_SUPERUSER_PASSWORD=adminpassword123
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: quizforge-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
